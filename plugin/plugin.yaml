name: openwebui-platform
label: Open WebUI
kind: platform
version: 1.0.0
description: >
  Open WebUI Channels gateway adapter for Hermes Agent.
  Connects to an Open WebUI instance via its REST API and relays
  messages between a designated channel and the Hermes agent.
  Requires an API key from an Open WebUI user account and a
  channel for the bot to operate in.
author: Hannah / Nous Research
requires_env:
  - name: OPENWEBUI_URL
    description: "Open WebUI instance URL (e.g. http://192.168.1.100:3000 or http://openwebui.tailnet.ts.net:3000)"
    prompt: "Open WebUI URL"
    password: false
  - name: OPENWEBUI_API_KEY
    description: "API key from an Open WebUI user account (Admin Panel → API Keys, or user settings → API Keys)"
    prompt: "Open WebUI API key"
    password: true
  - name: OPENWEBUI_CHANNEL_NAME
    description: "Name of the channel Hermes should watch (e.g. #hermes, 'Hermes & Me', or the channel ID directly)"
    prompt: "Channel name or ID"
    password: false
optional_env:
  - name: OPENWEBUI_POLL_INTERVAL
    description: "How often to check for new messages in seconds (default: 3)"
    prompt: "Poll interval (seconds)"
    password: false
  - name: OPENWEBUI_HOME_CHANNEL
    description: "Channel for cron / notification delivery (defaults to OPENWEBUI_CHANNEL_NAME)"
    prompt: "Home channel (or empty)"
    password: false
